<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产品列表 — 【你的名字】 | 独立开发者</title>
  <meta name="description" content="个人开发者的软件产品列表：CYAudit 审计系统及后续作品。">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <header class="site-header" data-mount="header"></header>

  <section class="section" style="padding-top:56px;">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow">Products</span>
        <h2>全部产品</h2>
        <p>每个产品都有独立详情页；新增产品只需在 <code>assets/js/site-config.js</code> 中加一条记录，并复制详情页模板。</p>
      </div>
      <div class="grid grid-2" data-mount="all-products"></div>
    </div>
  </section>

  <footer class="site-footer" data-mount="footer"></footer>
  <script src="../assets/js/site-config.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
